name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install ruff
      - run: ruff check deeptrader tests   # ponytail: scripts/ 는 기존 스타일 위반이 많아 제외, 정리 후 포함

  test:
    needs: lint
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -v --junitxml=junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.os }}-py${{ matrix.python }}
          path: junit.xml
          retention-days: 14

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30

  deploy:
    needs: build
    if: github.event_name != 'pull_request'     # PR 에서는 배포하지 않는다 (Secrets 보호)
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: write                            # 태그 릴리스 생성용
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install built wheel and smoke test
        run: |
          pip install dist/*.whl
          python -c "import deeptrader; print('deeptrader', deeptrader.__version__)"

      - name: Deploy (Secrets 주입)
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          test -n "$DEPLOY_TOKEN" || { echo "DEPLOY_TOKEN 이 설정되지 않았습니다"; exit 1; }
          echo "토큰 길이: ${#DEPLOY_TOKEN}"       # 값은 로그에 ***로 마스킹된다
          echo "token=$DEPLOY_TOKEN"               # 마스킹 확인용
          ls -l dist/
          # ponytail: 실제 배포 대상(서버/PyPI)이 없어 여기까지만. 대상이 정해지면 이 단계에서 업로드한다.

      - name: GitHub Release (태그 push 시)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
