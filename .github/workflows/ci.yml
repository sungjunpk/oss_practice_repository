name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 변경 파일 감지 — 코드·CI 설정이 바뀐 경우에만 아래 파이프라인을 돌린다.
  # 태그 push·수동 실행은 항상 전체 실행.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.f.outputs.code == 'true' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            code:
              - 'deeptrader/**'
              - 'tests/**'
              - 'pyproject.toml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_*.yml'
              - '.github/actions/**'

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
        with:
          extras: dev
      - run: ruff check deeptrader tests   # ponytail: scripts/ 는 기존 스타일 위반이 많아 제외, 정리 후 포함

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: ubuntu-22.04      # 이전 LTS 이미지에서도 최소 지원 버전 확인
            python: "3.10"
    uses: ./.github/workflows/_test.yml
    with:
      os: ${{ matrix.os }}
      python: ${{ matrix.python }}

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
        with:
          extras: ""
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30

  # 선택적 배포: PR 은 배포 안 함 / main push → staging / v* 태그 → production + Release
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
      release: ${{ startsWith(github.ref, 'refs/tags/v') }}
    secrets: inherit
