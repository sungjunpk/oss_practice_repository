name: Issue auto reply

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - run: |
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
          BODY: |
            이슈를 접수했습니다. 48시간 내에 1차 응답을 드립니다 (SLA).
            - 재현 방법·로그가 있으면 추가해 주세요.
            - 막힌 부분은 [Troubleshooting](https://github.com/${{ github.repository }}/wiki/Troubleshooting) 을 먼저 확인해 보세요.
            - 열린 질문·제안은 Discussions 가 더 적합합니다.
