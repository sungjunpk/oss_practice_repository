name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  conventional-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Check Conventional Commits format
        env:
          TITLE: ${{ github.event.pull_request.title }}   # env 로 넘겨 스크립트 인젝션 방지
        run: |
          # 타입 추가 시 CONTRIBUTING.md 2절도 함께 수정
          re='^(feat|fix|docs|refactor|test|chore|ci|perf|revert)(\([a-z0-9-]+\))?!?: .+'
          if [[ "$TITLE" =~ $re || "$TITLE" == 'Revert "'* ]]; then   # GitHub Revert 버튼 기본 제목 허용
            echo "OK: $TITLE"
          else
            echo "::error::PR 제목이 Conventional Commits 형식이 아닙니다: '$TITLE'"
            echo "예) feat(data): 일봉 시세 수집 스크립트 추가 — CONTRIBUTING.md 참고"
            exit 1
          fi
