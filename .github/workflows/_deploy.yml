# Reusable workflow — 빌드 아티팩트를 받아 환경(staging/production)에 배포한다.
name: _deploy

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      release:
        type: boolean
        default: false
    secrets:
      DEPLOY_TOKEN:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install built wheel and smoke test
        run: |
          pip install dist/*.whl
          python -c "import deeptrader; print('deeptrader', deeptrader.__version__)"

      - name: Deploy (Secrets 주입)
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          TARGET: ${{ inputs.environment }}
        run: |
          test -n "$DEPLOY_TOKEN" || { echo "DEPLOY_TOKEN 이 설정되지 않았습니다"; exit 1; }
          echo "대상 환경: $TARGET / 토큰 길이: ${#DEPLOY_TOKEN}"
          ls -l dist/
          # ponytail: 실제 배포 대상(서버/PyPI)이 없어 여기까지만. 대상이 정해지면 이 단계에서 업로드한다.

      - name: GitHub Release
        if: inputs.release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
