title: "[RFC] "
labels: []
body:
  - type: textarea
    id: summary
    attributes:
      label: 요약
      description: 한 문단으로 무엇을 제안하는가?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: 동기
      description: 왜 필요한가? 지금 어떤 문제가 있는가?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안 내용
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 대안과 트레이드오프
  - type: input
    id: deadline
    attributes:
      label: 의견 수렴 마감일
      placeholder: YYYY-MM-DD
  - type: markdown
    attributes:
      value: 합의되면 `docs/adr/0000-template.md` 로 ADR 을 작성하고 이 토론을 링크합니다.
